<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{.Title}} · Audioborker</title>
  <link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/static/app.css?v={{.Version}}">
  <script src="/static/htmx.min.js?v={{.Version}}" defer></script>
  <script src="/static/htmx-ext-sse.js?v={{.Version}}" defer></script>
</head>
<body>
  <header class="topbar">
    <a class="brand" href="/import"><span class="brand-mark">◈</span> audioborker</a>
    <nav>
      <a href="/library" {{if eq .Active "library"}}class="active"{{end}}>Library</a>
      <a href="/import" {{if eq .Active "import"}}class="active"{{end}}>Import</a>
      <a href="/queue" {{if eq .Active "queue"}}class="active"{{end}}>Queue</a>
      <a href="/settings" {{if eq .Active "settings"}}class="active"{{end}}>Settings</a>
    </nav>
  </header>
  <main>
    {{template "flash" .}}
    {{template "content" .}}
  </main>
  <footer>audioborker {{.Version}}</footer>
  <script>
    // Covers marked data-res get their pixel size written underneath. They
    // load the URL that gets embedded, so this is the size the file gets;
    // data-fallback swaps in the plain URL if that fails, as the pipeline does.
    function coverRes(img) {
      let cap = img.nextElementSibling;
      if (!cap || !cap.classList.contains('cover-res')) {
        cap = document.createElement('span');
        cap.className = 'cover-res';
        img.after(cap);
      }
      cap.textContent = img.naturalWidth ? img.naturalWidth + '×' + img.naturalHeight : '';
    }
    document.addEventListener('load', e => {
      if (e.target.tagName === 'IMG' && e.target.hasAttribute('data-res')) coverRes(e.target);
    }, true);
    document.addEventListener('error', e => {
      const img = e.target;
      if (img.tagName === 'IMG' && img.dataset.fallback && img.src !== img.dataset.fallback) img.src = img.dataset.fallback;
    }, true);
    document.querySelectorAll('img[data-res]').forEach(img => { if (img.complete && img.naturalWidth) coverRes(img); });

    // Success flashes fade out; error flashes stay until dismissed by
    // navigation so problems don't vanish unread.
    document.querySelectorAll('.flash-ok').forEach(el => {
      setTimeout(() => {
        el.style.transition = 'opacity 0.6s';
        el.style.opacity = '0';
        setTimeout(() => el.remove(), 700);
      }, 4000);
    });
  </script>
</body>
</html>
