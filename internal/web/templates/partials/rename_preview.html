{{define "rename_preview"}}
{{if .Err}}
<div class="rename-box warn-text">⚠ {{.Err}}</div>
{{else if .Same}}
<div class="rename-box muted">📁 Already in place</div>
{{else if .New}}
<div class="rename-box">
  <div class="rename-line"><span class="rename-label">From</span><span class="muted">{{.Old}}</span></div>
  <div class="rename-line"><span class="rename-label">To</span><strong>{{.New}}</strong></div>
</div>
{{end}}
{{end}}
