{{define "chapter_plan"}}
{{if .Err}}
  <span class="muted">⚠ {{.Err}}</span>
{{else}}
  {{/* The same choice as the Chapters dialog's dropdown, from the row. */}}
  <span class="plan-sources">
    <button type="button" class="plan-src{{if .FileUsed}} plan-src-on{{end}}" onclick="pickChapters(this, 'existing')"
            {{if not .FileCount}}disabled{{end}}>{{if .Multi}}🧩 {{.FileCount}} files{{else if .FileFrom}}📄 {{.FileCount}} in .chapters.txt{{else}}📼 {{if .FileCount}}{{.FileCount}}{{else}}none{{end}} in file{{end}}</button>
    <button type="button" class="plan-src{{if .ProviderUsed}} plan-src-on{{end}}" onclick="pickChapters(this, 'provider')"
            {{if not .ProviderCount}}disabled{{end}}>🌐 {{if .ProviderCount}}{{.ProviderCount}}{{else}}none{{end}} on Audible</button>
  </span>
  <span class="plan-verdict plan-{{.Source}}">{{.Icon}} {{.Verdict}}</span>
  <span class="muted">{{.Reason}}</span>
  {{with .Shift}}<span class="muted">{{.}}</span>{{end}}
  {{range .Warnings}}<span class="warn-text">⚠ {{.}}</span>{{end}}
  {{with .Overflow}}<span class="warn-text plan-overflow">⚠ {{.}}</span>{{end}}
{{end}}
{{end}}
