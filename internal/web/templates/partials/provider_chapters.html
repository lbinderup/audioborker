{{define "provider_chapters"}}
{{if .Err}}
<h3 class="src-provider">Audible chapters</h3>
<p class="muted">⚠ {{.Err}}</p>
<button type="button" class="btn-ghost btn-small"
        hx-get="/match/provider-chapters"
        hx-target="closest .provider-col"
        hx-swap="innerHTML"
        hx-vals='js:{choice: document.querySelector(`input[name="match:{{.Path}}"]:checked`)?.value || "", path: {{.Path | printf "%q"}}, ...manualVals({{.Path | printf "%q"}})}'>
  Load for comparison
</button>
{{else}}
<h3 class="src-provider">Audible chapters <span class="muted">({{len .Chapters}} · {{.Runtime}}{{if not .Accurate}} · flagged inaccurate{{end}})</span></h3>
<div class="chapter-list shiftable">
  {{range $i, $c := .Chapters}}
  <button type="button" class="chapter-btn" data-ms="{{$c.StartMs}}" data-idx="{{add $i 1}}" onclick="seekPreview(this)">
    <span class="chapter-idx">{{add $i 1}}</span><span class="chapter-stamp">{{$c.Stamp}}</span> {{$c.Title}}
  </button>
  {{end}}
</div>

<button type="button" class="btn-ghost btn-small use-chapters" onclick="useChapters(this, 'provider')">
  Use these chapters
</button>
{{end}}
{{end}}
