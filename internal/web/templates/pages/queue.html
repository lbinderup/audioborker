{{define "content"}}
<section class="card" hx-ext="sse" sse-connect="/events">
  <div class="queue-head">
    <h1>Queue</h1>
    <form method="post" action="/queue/clear-history"
          onsubmit="return confirm('Remove all finished, failed and cancelled jobs from the history?')">
      <button type="submit" class="btn-ghost">Clear history</button>
    </form>
  </div>

  {{/* Also on sse:connected: a job can finish between this page rendering
       and its stream connecting (a sort job takes milliseconds), and that
       event went to nobody. Reconnects after a network blip are covered too. */}}
  <div id="queue-table" hx-get="/queue/table?page={{.Page}}" hx-trigger="sse:queue-changed, sse:connected" hx-swap="innerHTML">
    {{template "queue_table" .}}
  </div>
</section>
{{end}}
